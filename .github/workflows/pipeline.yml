name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Verificação de vazamento de segredos (Gitleaks)
  secret-scan:
    name: 1. Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Testes unitários da aplicação Node.js
  tests:
    name: 2. Testes Unitários (Jest)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Testes com Cobertura
        run: npm test -- --coverage

  # Job 3: Análise estática da Infraestrutura (Checkov)
  iac-scan:
    name: 3. IaC Scan (Checkov)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Análise Checkov no Terraform
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true

  # Job 4: Build da Imagem Docker e Scan de Vulnerabilidade (Trivy)
  docker-build-scan:
    name: 4. Build e Scan Docker (Trivy)
    runs-on: ubuntu-latest
    needs: iac-scan
    continue-on-error: true
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Build da Imagem Docker
        run: docker build -t ghcr.io/${{ github.repository }}:latest .

      - name: Instalar e Executar Trivy CLI
        run: |
          wget https://github.com/aquasecurity/trivy/releases/download/v0.48.3/trivy_0.48.3_Linux-64bit.deb
          sudo dpkg -i trivy_0.48.3_Linux-64bit.deb
          trivy image --exit-code 0 --severity CRITICAL,HIGH ghcr.io/${{ github.repository }}:latest

  # Job 5: Publicação no Registry Privado (GHCR)
  publish:
    name: 5. Publicar Imagem no GHCR
    runs-on: ubuntu-latest
    needs: docker-build-scan
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push da Imagem Aprovada
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest